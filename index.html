<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>read with seba</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#1d2a29;--mute:#5f7170;--accent:#1f6f68;--line:#d9e2dd;--fs:21px}
:root[data-theme="dark"]{--bg:#111617;--card:#1a2122;--ink:#e6eeec;--mute:#93a8a5;--accent:#5cc3b8;--line:#2b3638}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:22px;direction:ltr;letter-spacing:.5px}
.logo b{color:var(--accent)}
.tools{display:flex;gap:8px}
.tools button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px;min-width:40px}
main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:30px;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.story{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.story:hover{border-color:var(--accent)}
.cover{flex:0 0 64px;height:88px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 30px Amiri,serif}
.story h2{margin:0 0 2px;font-size:20px}
.story p{margin:0;color:var(--mute);font-size:15px}
.tag{display:inline-block;margin-top:8px;font-size:13px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:0 10px}
.reader h1{font-family:Amiri,serif;font-size:32px}
.text{font-family:Amiri,serif;font-size:var(--fs);line-height:2.1;max-width:34em}
.text p{margin:0 0 1.1em}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:32px}
.nav a,.back{display:inline-block;background:var(--accent);color:#fff;padding:8px 20px;border-radius:10px;font-weight:600}
.nav a.off{visibility:hidden}
.back{background:none;color:var(--accent);padding:0;margin-bottom:6px}
.chaps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 28px}
.chaps a{border:1px solid var(--line);border-radius:10px;padding:2px 14px;font-size:15px}
.chaps a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pts{background:var(--accent);color:#fff;border-radius:20px;padding:2px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;font-weight:600;font-size:17px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.done{color:var(--accent);font-weight:600}
.finish{display:block;width:100%;margin-top:28px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:18px}
.finish[disabled]{background:var(--card);color:var(--accent);border:1px solid var(--accent);cursor:default}
.text[dir=ltr]{font-family:Georgia,serif;line-height:1.9;font-size:calc(var(--fs) - 3px)}
.en{direction:ltr;text-align:left}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:15px}
.acct button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:2px 12px;margin-inline-start:6px;font-weight:600}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.hero .avatar{width:104px;height:104px;flex:none;border-radius:50%;object-fit:cover;border:3px solid var(--accent)}
.hero h1{margin:0}.hero .sub{margin:4px 0 0}
footer{text-align:center;color:var(--mute);font-size:14px;padding:20px}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">read with <b>seba</b></a>
  <div class="tools">
    <span class="pts" id="pts" title="نقاط صبا"></span>
    <button id="smaller" aria-label="تصغير الخط">أ-</button>
    <button id="bigger" aria-label="تكبير الخط">أ+</button>
    <button id="theme" aria-label="الوضع الليلي">🌙</button>
  </div>
</header>
<main id="app"></main>
<footer>read with seba</footer>

<script>
/* ===== أضف قصصك هنا =====
   كل قصة: id (انجليزي بدون مسافات)، lang (ar للعربي أو en للانجليزي)، points (نقاط صبا، الافتراضي 10)
   وبعدين: id (انجليزي بدون مسافات)، title، author، tag، summary، وchapters
   كل فصل: title و text (الفقرات مفصولة بسطر فاضي) */
const STORIES = [
  {
    id: "sample",
    lang: "ar",
    points: 10,
    title: "قصة تجريبية",
    author: "اسمك هنا",
    tag: "قصة قصيرة",
    summary: "امسح القصة دي وحط قصتك مكانها.",
    chapters: [
      { title: "الفصل الأول", text: "دي أول فقرة في القصة التجريبية.\n\nودي الفقرة التانية. الفقرات بتتفصل بسطر فاضي." },
      { title: "الفصل الثاني", text: "ده الفصل التاني.\n\nاستخدم أزرار التالي والسابق للتنقل بين الفصول." }
    ]
  },
  {
    id: "sample-en",
    lang: "en",
    points: 10,
    title: "A Sample Story",
    author: "Your name here",
    tag: "Short story",
    summary: "Delete this story and add your own.",
    chapters: [
      { title: "Chapter 1", text: "This is the first paragraph of the sample story.\n\nThis is the second paragraph. Separate paragraphs with an empty line." },
      { title: "Chapter 2", text: "This is chapter two.\n\nUse the next and previous buttons to move between chapters." }
    ]
  }
];

const app = document.getElementById("app");
const root = document.documentElement;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };
const load = k => { try { return localStorage.getItem(k) } catch (e) { return null } };

let fs = parseInt(load("fs")) || 21;
const applyFs = () => root.style.setProperty("--fs", fs + "px");
const applyTheme = t => { root.dataset.theme = t; document.getElementById("theme").textContent = t === "dark" ? "☀️" : "🌙"; };
applyFs();
applyTheme(load("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

document.getElementById("bigger").onclick = () => { fs = Math.min(36, fs + 2); save("fs", fs); applyFs(); };
document.getElementById("smaller").onclick = () => { fs = Math.max(15, fs - 2); save("fs", fs); applyFs(); };
document.getElementById("theme").onclick = () => { const t = root.dataset.theme === "dark" ? "light" : "dark"; save("theme", t); applyTheme(t); };

let tab = load("tab") || "ar";
let readMap = {};
try { readMap = JSON.parse(load("read") || "{}"); } catch (e) {}
const pts = s => s.points || 10;
function renderPts() {
  const total = STORIES.reduce((a, s) => a + (readMap[s.id] ? pts(s) : 0), 0);
  document.getElementById("pts").textContent = "⭐ " + total + " نقطة صبا";
}
renderPts();

let cloudUser = null;
function acct() {
  if (!window.SebaCloud) return "";
  return cloudUser
    ? `<p class="acct">أهلاً ${esc(cloudUser.name || "")} · نقاطك محفوظة ☁️ <button id="lo">خروج</button></p>`
    : `<p class="acct">سجّل دخولك بحساب جوجل عشان نقاطك تتحفظ على كل أجهزتك <button id="li">تسجيل الدخول</button></p>`;
}
addEventListener("seba-auth", e => {
  cloudUser = e.detail.user;
  if (cloudUser) {
    const merged = Object.assign({}, readMap, e.detail.read);
    const changed = Object.keys(merged).length !== Object.keys(e.detail.read).length;
    readMap = merged; save("read", JSON.stringify(readMap));
    if (changed) window.SebaCloud.push(readMap).catch(() => {});
  }
  renderPts();
  if (!location.hash.split("/")[1]) home();
});

function home() {
  document.title = "read with seba";
  const list = STORIES.filter(s => s.lang === tab);
  app.innerHTML = `<div class="hero">${AVATAR}<div><h1>اقرأ مع صبا</h1><p class="sub">اقرأ قصة للآخر واجمع نقاط صبا.</p></div></div>
    ${acct()}
    <div class="tabs"><button data-t="ar" class="${tab === "ar" ? "on" : ""}">قصص عربي</button><button data-t="en" class="${tab === "en" ? "on" : ""}">English stories</button></div>` +
    (list.length ? list.map(s => `<a class="story" href="#/${s.id}/1">
      <div class="cover" aria-hidden="true">${esc(s.title[0])}</div>
      <div class="${s.lang === "en" ? "en" : ""}"><h2>${esc(s.title)}</h2><p>${esc(s.summary)}</p>
      <span class="tag">${esc(s.tag)}</span> <span class="${readMap[s.id] ? "done" : "tag"}">${readMap[s.id] ? "✓ تمت قراءتها" : "+" + pts(s) + " نقطة صبا"}</span></div></a>`).join("")
      : `<p class="sub">مفيش قصص في القسم ده لسه.</p>`);
  const li = document.getElementById("li"), lo = document.getElementById("lo");
  if (li) li.onclick = () => window.SebaCloud.login().catch(() => alert("ما قدرناش نسجل الدخول، جرّب تاني"));
  if (lo) lo.onclick = () => window.SebaCloud.logout();
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; save("tab", tab); home(); });
}

function read(id, n, keep) {
  const s = STORIES.find(x => x.id === id);
  const c = s && s.chapters[n - 1];
  if (!c) { app.innerHTML = `<h1>القصة مش موجودة</h1><a class="back" href="#/">ارجع للرئيسية</a>`; return; }
  document.title = `${c.title} - ${s.title} | read with seba`;
  const paras = c.text.split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join("");
  const prev = n > 1 ? `<a href="#/${id}/${n - 1}">السابق</a>` : `<a class="off">السابق</a>`;
  const next = n < s.chapters.length ? `<a href="#/${id}/${n + 1}">التالي</a>` : `<a class="off">التالي</a>`;
  app.innerHTML = `<div class="reader"><a class="back" href="#/">كل القصص</a>
    <h1 class="${s.lang === "en" ? "en" : ""}">${esc(s.title)}</h1><p class="sub ${s.lang === "en" ? "en" : ""}">${esc(s.author)}</p>
    <nav class="chaps" aria-label="الفصول">${s.chapters.map((x, i) => `<a href="#/${id}/${i + 1}" class="${i + 1 === n ? "on" : ""}">${esc(x.title)}</a>`).join("")}</nav>
    <div class="text" dir="${s.lang === "en" ? "ltr" : "rtl"}">${paras}</div>
    ${n === s.chapters.length ? `<button class="finish" id="fin" ${readMap[s.id] ? "disabled" : ""}>${readMap[s.id] ? "✓ خدت نقاط القصة دي" : "خلصت القصة، خد " + pts(s) + " نقطة صبا"}</button>` : ""}
    <div class="nav">${prev}${next}</div></div>`;
  const fin = document.getElementById("fin");
  if (fin) fin.onclick = () => { readMap[s.id] = true; save("read", JSON.stringify(readMap)); renderPts(); if (cloudUser) window.SebaCloud.push(readMap).catch(() => {}); read(id, n, true); };
  if (!keep) window.scrollTo(0, 0);
}

function route() {
  const [, id, n] = location.hash.split("/");
  id ? read(id, parseInt(n) || 1) : home();
}
addEventListener("hashchange", route);
route();
</script>
